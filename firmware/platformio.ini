; GuiaSense — firmware (PlatformIO)
; Ambientes:
;   esp32c3  -> placa real (ESP32-C3 Super Mini + VL53L0X)         pio run -e esp32c3 -t upload
;   wokwi    -> simulação no Wokwi (potenciômetro no lugar do sensor) pio run -e wokwi
;   native   -> testes unitários da lógica de alerta no PC           pio test -e native

[platformio]
src_dir = GuiaSense
default_envs = esp32c3

[common_esp32]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@4.4.17
    pololu/VL53L0X@1.3.1
build_flags =
    ; Serial via USB nativo do C3 Super Mini
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
extends = common_esp32

[env:wokwi]
extends = common_esp32
; no Wokwi o monitor serial é ligado na UART (TX/RX), não no USB nativo
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSENSOR_SIMULADO

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -I GuiaSense
